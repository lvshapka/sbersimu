 <p>успешно</p>
 <img src="success.png">

 <span id="paysumma"></span>₽
 <audio src="catpay.mp3" autoplay loop></audio>
<script>
 const params = new URLSearchParams(window.location.search);
 const summa = params.get("paysumma");

 document.getElementById("paysumma").textContent = summa;

 setTimeout(function() {
     window.location.href = "index.html";
 }, 11000);
   const audio = document.getElementById('bg-audio');
  
  // Задаем скорость (0.5 — в два раза медленнее, 0.8 — чуть медленнее)
  audio.playbackRate = 0.36;

  // Пытаемся запустить сразу при загрузке
  audio.play().catch(() => {
    // Если браузер заблокировал, запускаем при первом клике/тапе
    document.addEventListener('click', () => {
      audio.playbackRate = 0.36; // Дублируем на случай сброса
      audio.play();
    }, { once: true });
  });
 </script>
